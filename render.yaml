services:
  # Backend API Service
  - type: web
    name: interior-design-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
        # Set this in Render dashboard: mongodb://localhost:27017/interior-design
        # Or use MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: FRONTEND_ORIGIN
        sync: false
        # Set this to your frontend URL after deployment
        # Example: https://interior-design-frontend.onrender.com
      - key: EMAIL_USER
        sync: false
        # Your email for nodemailer
      - key: EMAIL_PASS
        sync: false
        # Your email app password
      - key: ADMIN_EMAIL
        sync: false
        # Admin email address

  # Frontend Static Site
  - type: web
    name: interior-design-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
        # Set this to your backend URL after deployment
        # Example: https://interior-design-backend.onrender.com/api

  # MongoDB Database (Optional - if you want Render to manage it)
  # Uncomment if you want Render to create a MongoDB instance
  # - type: psmdb
  #   name: interior-design-db
  #   plan: free
  #   region: oregon
  #   databaseName: interior-design
  #   databaseUser: interior-user
